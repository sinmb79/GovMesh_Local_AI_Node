name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .[dev]
      - name: Run tests
        run: python -m pytest
      - name: Release gate
        run: python scripts/release_gate.py --skip-pytest
